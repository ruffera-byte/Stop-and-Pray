<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24352f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Stop & Pray">
  <title>Stop & Pray</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f2e9;
      --panel: #fffdf7;
      --text: #1e2925;
      --muted: #67736e;
      --accent: #315f50;
      --accent-2: #dfe9e3;
      --border: #d9ddd9;
      --danger: #8b3a3a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121916;
        --panel: #1b2521;
        --text: #eef4f0;
        --muted: #aebbb5;
        --accent: #8ab8a5;
        --accent-2: #263a32;
        --border: #35443e;
        --danger: #e09a9a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }
    main {
      width: min(100%, 480px);
      text-align: center;
    }
    .cross {
      font-family: Georgia, serif;
      font-size: 34px;
      color: var(--accent);
      margin-bottom: 8px;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(32px, 9vw, 46px);
      margin: 0;
      font-weight: 600;
    }
    .date {
      color: var(--muted);
      margin: 8px 0 24px;
      font-size: 17px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 28px 22px 22px;
    }
    .label {
      color: var(--muted);
      font-size: 16px;
    }
    .count {
      font-size: clamp(78px, 25vw, 120px);
      line-height: 1;
      font-weight: 700;
      margin: 8px 0 4px;
      font-variant-numeric: tabular-nums;
    }
    .goal-line {
      color: var(--muted);
      margin-bottom: 20px;
      min-height: 24px;
    }
    .progress {
      height: 10px;
      background: var(--accent-2);
      border-radius: 99px;
      overflow: hidden;
      margin: 0 6px 24px;
    }
    .progress > div {
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: inherit;
      transition: width .25s ease;
    }
    button {
      font: inherit;
      border-radius: 18px;
      border: 1px solid var(--border);
      min-height: 54px;
      cursor: pointer;
    }
    .add {
      width: 100%;
      min-height: 82px;
      border: 0;
      background: var(--accent);
      color: white;
      font-size: 24px;
      font-weight: 650;
      box-shadow: 0 5px 14px rgba(0,0,0,.12);
    }
    @media (prefers-color-scheme: dark) {
      .add { color: #102019; }
    }
    .add:active { transform: scale(.985); }
    .secondary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    .secondary button {
      background: transparent;
      color: var(--text);
    }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .stat {
      background: var(--accent-2);
      border-radius: 18px;
      padding: 14px 8px;
    }
    .stat strong {
      display: block;
      font-size: 24px;
    }
    .stat span {
      color: var(--muted);
      font-size: 14px;
    }
    details {
      margin-top: 18px;
      text-align: left;
      color: var(--muted);
    }
    summary {
      cursor: pointer;
      text-align: center;
      padding: 8px;
    }
    .settings {
      padding: 10px 4px 0;
    }
    .settings label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    input[type="number"] {
      width: 90px;
      font: inherit;
      font-size: 18px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
    }
    .reset {
      width: 100%;
      margin-top: 14px;
      background: transparent;
      color: var(--danger);
    }
    .message {
      min-height: 25px;
      margin: 12px 0 0;
      color: var(--accent);
      font-weight: 600;
    }
    .verse {
      margin: 22px 14px 0;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <div class="cross" aria-hidden="true">✝</div>
    <h1>Stop &amp; Pray</h1>
    <div class="date" id="date"></div>

    <section class="panel" aria-label="Prayer tally">
      <div class="label">Today’s tally</div>
      <div class="count" id="count" aria-live="polite">0</div>
      <div class="goal-line" id="goalLine"></div>
      <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>

      <button class="add" id="addButton" type="button">+ I stopped and prayed</button>

      <div class="secondary">
        <button id="undoButton" type="button">Undo last</button>
        <button id="shareButton" type="button">Copy summary</button>
      </div>

      <div class="message" id="message" aria-live="polite"></div>

      <div class="stats">
        <div class="stat">
          <strong id="weekTotal">0</strong>
          <span>Last 7 days</span>
        </div>
        <div class="stat">
          <strong id="allTotal">0</strong>
          <span>All-time tally</span>
        </div>
      </div>

      <details>
        <summary>Settings</summary>
        <div class="settings">
          <label for="goal">
            Daily goal
            <input id="goal" type="number" min="1" max="100" inputmode="numeric">
          </label>
          <button class="reset" id="resetTodayButton" type="button">Reset today’s tally</button>
          <button class="reset" id="resetAllButton" type="button">Erase all history</button>
        </div>
      </details>
    </section>

    <p class="verse">“Pray continually.” — 1 Thessalonians 5:17</p>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "stopAndPrayDataV1";
      const todayKey = () => {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      };

      const load = () => {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (parsed && typeof parsed === "object") {
            return {
              goal: Number(parsed.goal) || 10,
              days: parsed.days && typeof parsed.days === "object" ? parsed.days : {}
            };
          }
        } catch (_) {}
        return { goal: 10, days: {} };
      };

      let data = load();
      let messageTimer;

      const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      const currentCount = () => Number(data.days[todayKey()] || 0);

      const showMessage = (text) => {
        const el = document.getElementById("message");
        el.textContent = text;
        clearTimeout(messageTimer);
        messageTimer = setTimeout(() => { el.textContent = ""; }, 1800);
      };

      const render = () => {
        const count = currentCount();
        const goal = Math.max(1, Number(data.goal) || 10);

        document.getElementById("date").textContent =
          new Intl.DateTimeFormat(undefined, {
            weekday: "long", month: "long", day: "numeric"
          }).format(new Date());

        document.getElementById("count").textContent = count;
        document.getElementById("goal").value = goal;
        document.getElementById("goalLine").textContent =
          count >= goal ? `Daily goal reached — ${count} of ${goal}` : `${count} of ${goal} daily goal`;
        document.getElementById("progressBar").style.width =
          `${Math.min(100, (count / goal) * 100)}%`;

        const entries = Object.entries(data.days);
        document.getElementById("allTotal").textContent =
          entries.reduce((sum, [, value]) => sum + Number(value || 0), 0);

        const cutoff = new Date();
        cutoff.setHours(0, 0, 0, 0);
        cutoff.setDate(cutoff.getDate() - 6);

        const weekTotal = entries.reduce((sum, [date, value]) => {
          const [y, m, d] = date.split("-").map(Number);
          const itemDate = new Date(y, m - 1, d);
          return itemDate >= cutoff ? sum + Number(value || 0) : sum;
        }, 0);
        document.getElementById("weekTotal").textContent = weekTotal;
      };

      const addOne = (automatic = false) => {
        const key = todayKey();
        data.days[key] = currentCount() + 1;
        save();
        render();
        if (!automatic) showMessage("Prayer added.");
        if (navigator.vibrate) navigator.vibrate(30);
      };

      document.getElementById("addButton").addEventListener("click", () => addOne());

      document.getElementById("undoButton").addEventListener("click", () => {
        const key = todayKey();
        const count = currentCount();
        if (count > 0) {
          data.days[key] = count - 1;
          save();
          render();
          showMessage("Last tally removed.");
        } else {
          showMessage("Nothing to undo.");
        }
      });

      document.getElementById("goal").addEventListener("change", (event) => {
        data.goal = Math.min(100, Math.max(1, Number(event.target.value) || 10));
        save();
        render();
        showMessage("Daily goal updated.");
      });

      document.getElementById("resetTodayButton").addEventListener("click", () => {
        if (confirm("Reset today’s tally to zero?")) {
          data.days[todayKey()] = 0;
          save();
          render();
          showMessage("Today reset.");
        }
      });

      document.getElementById("resetAllButton").addEventListener("click", () => {
        if (confirm("Erase every saved tally? This cannot be undone.")) {
          data.days = {};
          save();
          render();
          showMessage("History erased.");
        }
      });

      document.getElementById("shareButton").addEventListener("click", async () => {
        const text = `Stop & Pray: ${currentCount()} prayer stops today; ${
          Object.values(data.days).reduce((sum, value) => sum + Number(value || 0), 0)
        } all time.`;
        try {
          await navigator.clipboard.writeText(text);
          showMessage("Summary copied.");
        } catch (_) {
          prompt("Copy this summary:", text);
        }
      });

      render();

      const params = new URLSearchParams(location.search);
      if (params.get("add") === "1") {
        addOne(true);
        history.replaceState({}, "", location.pathname + location.hash);
        showMessage("Prayer added.");
      }
    })();
  </script>
</body>
</html>
